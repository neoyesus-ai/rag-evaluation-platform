services:
  backend:
    build: ./backend
    container_name: rag_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/documents:/data/documents
      - ./data/datasets:/data/datasets
      - ./data/rendered_pages:/data/rendered_pages
    depends_on:
      - postgres
      - redis
      - chromadb
      - ollama
      - mlflow

  worker:
    build: ./worker
    container_name: rag_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./worker/app:/app/app
      - ./data/documents:/data/documents
      - ./data/datasets:/data/datasets
      - ./data/rendered_pages:/data/rendered_pages
    depends_on:
      - postgres
      - redis
      - chromadb
      - ollama
      - mlflow

  frontend:
    build: ./frontend
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: rag_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: rag_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ./data/ollama:/root/.ollama

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: rag_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlflow:/mlflow
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  metabase:
    image: metabase/metabase:latest
    container_name: rag_metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./data/metabase:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - postgres

networks:
  default:
    name: rag_network